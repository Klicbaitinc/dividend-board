# Daily refresh + deploy to GitHub Pages.
# Schedule: 01:30 UTC every day. Also runs on push to main and manual dispatch.
#
# data/events.json is committed back to main. That commit only touches
# data/events.json and is marked [skip ci], and this workflow ignores pushes
# that only change that file, so the data commit cannot start another run.
#
# Pages source must be "GitHub Actions" (Settings → Pages). This token cannot
# turn Pages on by itself; see the README.
#
# Optional repository variables:
#   SEC_USER_AGENT  contact string for SEC EDGAR (email recommended by the SEC)
#   SITE_URL        origin only, default https://klicbaitinc.github.io
#   BASE_PATH       path prefix, default /dividend-board (use / for a user site)
name: Refresh data and deploy site

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC daily (after the SEC's evening filing rush)
  push:
    branches: [main]
    paths-ignore:
      - "data/events.json"
  workflow_dispatch: {}

permissions:
  contents: write    # commit updated data/events.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'DividendRaiseCutBoard (https://github.com/Klicbaitinc/dividend-board)' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://klicbaitinc.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/dividend-board' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore SEC document cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Snapshot current events
        run: cp data/events.json /tmp/events.json.bak
      - name: Fetch dividend events from SEC EDGAR
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_dividends.py --days 14
      - name: Keep last good events.json if the fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          cp /tmp/events.json.bak data/events.json
          echo "::warning::SEC fetch failed. Deploying the events.json already in the repo. Set the SEC_USER_AGENT repository variable to a declared User-Agent that includes a contact email SEC will accept."
      - name: Build static site
        run: python scripts/build_site.py
      - name: Check links under the project base path
        run: |
          set -euo pipefail
          base="${BASE_PATH%/}"
          origin="${SITE_URL%/}"
          public="${origin}${base}"
          grep -q "href=\"${base}/static/style.css\"" site/index.html
          grep -q "src=\"${base}/static/app.js\"" site/index.html
          grep -q "href=\"${public}/\"" site/index.html
          grep -q "Sitemap: ${public}/sitemap.xml" site/robots.txt
          grep -q "<loc>${public}/</loc>" site/sitemap.xml
          ticker=$(find site/stock -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          test -n "$ticker"
          grep -q "href=\"${base}/static/style.css\"" "site/stock/${ticker}/index.html"
          grep -q "href=\"${public}/stock/${ticker}/\"" "site/stock/${ticker}/index.html"
          grep -q "<loc>${public}/stock/${ticker}/</loc>" site/sitemap.xml
          echo "base path ok (${public}) stock ${ticker}"
      - name: Commit updated data
        if: steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "dividend-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "events.json unchanged"
            exit 0
          fi
          # [skip ci] is honored for push events. paths-ignore above is the second guard.
          git commit -m "Data refresh $(date -u +%F) [skip ci]"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
